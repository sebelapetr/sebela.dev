# Model evals of the administrative MCP server (.plan/05-mcp-admin/evals.md).
#
# Do not run this file directly: `node evals/run.js` starts a clean API and MCP server for every
# case-run, passes the address and an ephemeral key through the environment and applies the gates.
# Pinned settings: Promptfoo 0.126.0 (run through `pnpm dlx`), the provider and model below
# (Claude Sonnet 5.5 at medium effort, the model the owner's client uses; the owner's decision in
# .plan/05-mcp-admin/evals.md), prompt caching of the repeated prefix,
# @modelcontextprotocol/server 2.4.0, the model's default sampling, at most 4 tool calls and 4096
# output tokens per conversation, 120 s per case-run, and the frozen clock in prompt.json. The clock is frozen in the
# prompt only: the API and MCP Admin run on real time (the read-only S01 cases do not depend on it).
description: MCP Admin S01 read-only baseline

prompts:
  - file://prompt.json

providers:
  - id: anthropic:messages:claude-sonnet-5-5
    label: claude-sonnet-5-5
    config:
      max_tokens: 4096
      effort: medium
      # The system prompt and tool definitions repeat in every turn and case-run: read them from
      # the prompt cache instead of paying for them again.
      cache_control:
        type: ephemeral
      # No temperature: Claude Sonnet 5.5 refuses non-default sampling parameters, so repeats carry
      # the variance.
      # Enforced by Promptfoo, not sent to the model: a read-only case needs one or two calls.
      max_tool_calls: 4
      mcp:
        enabled: true
        server:
          name: sebela-admin
          url: "{{ env.MCP_ADMIN_EVAL_URL }}"
          headers:
            Authorization: "Bearer {{ env.MCP_ADMIN_EVAL_KEY }}"

tests: file://tests.js

evaluateOptions:
  maxConcurrency: 1
  # A case-run that takes longer is an error, not a hang.
  timeoutMs: 120000
