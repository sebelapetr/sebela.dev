# Reference nginx site configuration for sebela.dev on the server's nginx managed by the server's hosting panel
# (infra/README.md, docs/release-workflow.md). The hosting panel owns the live file and its Let's Encrypt
# certificate; this copy records what the site must contain, and a change to the site is made here
# first. Bunny CDN sits in front of the site.
#
# The site proxies to the website container only. Postgres, the API and MCP Admin have no host port,
# so the public edge cannot reach the API's private content-write routes or MCP Admin, with or
# without a key.
#
# Placeholders: replace `replace-with-the-web-port` with WEB_PORT of the production environment file
# (the website listens on the host's loopback interface only), the certificate paths with the ones
# the hosting panel created. The CDN edge address file is written by infra/scripts/bunny-edge-addresses.sh.

# --- http context (hosting panel: the site's "before" include) ----------------------------------------------
# Request budget per visitor address: generous for pages and their assets, short bursts allowed.
limit_req_zone $binary_remote_addr zone=sebela_web:10m rate=20r/s;
limit_req_status 429;

# Shared-cache rule for pages (infra/README.md, CDN caching; apps/web/AGENTS.md, Caching and
# invalidation). The website marks every page `no-store`, because only here are the upstream status
# and the navigation headers known. A page answer gets the public rule only when it is a GET or HEAD,
# the website answered 200 with HTML and set no cookie, the request is not a client navigation
# (`RSC`, `Next-Router-Prefetch`, `Next-Router-State-Tree` headers or an `_rsc` argument, with or
# without a value) and the path is not Ask, a visitor's own conversation.
#
# The rule shares every such page, even one the website marks `private`. A page that renders
# something per visitor (a CSP nonce, the homepage chat of phase 07) must be excluded here, next to
# Ask, before it ships.
#
# Everything else fails closed: a navigation is `no-store` whatever its status (Next answers one
# without a matching `_rsc` value with a 307 that has no Cache-Control, under the page's own cache
# key), any other answer keeps the website's own `Cache-Control`, and an answer without one (an
# answer nginx makes itself: the closed internal route, a 429, a 502 or 504 while the website is
# down; or a website answer without the header) is `no-store`, so the CDN serves its stale copy
# instead of keeping it.
map "$http_rsc$http_next_router_prefetch$http_next_router_state_tree" $sebela_navigation_header {
    default 1;
    "" 0;
}

map $args $sebela_navigation_argument {
    default 0;
    "~(^|&)_rsc(=|&|$)" 1;
}

map "$request_method|$upstream_status|$upstream_http_content_type|$upstream_http_set_cookie|$sebela_navigation_header$sebela_navigation_argument|$uri" $sebela_page_rule {
    default "";
    "~\|/ask(/.*)?$" "";
    "~^(GET|HEAD)\|200\|text/html[^|]*\|\|00\|/" "public, max-age=0, s-maxage=60, stale-while-revalidate=60, stale-if-error=86400";
}

map "$sebela_page_rule|$sebela_navigation_header$sebela_navigation_argument|$upstream_http_cache_control" $sebela_cache_control {
    "~^(?<page_rule>[^|]+)\|" $page_rule;
    "~^\|(1.|.1)\|" "no-store";
    "~^\|00\|(?<origin_rule>.+)$" $origin_rule;
    default "no-store";
}

upstream sebela_web {
    server 127.0.0.1:replace-with-the-web-port;
    keepalive 16;
}

# --- server context ---------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name sebela.dev www.sebela.dev;
    return 301 https://sebela.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.sebela.dev;
    ssl_certificate /etc/nginx/ssl/sebela.dev/replace-with-the-certificate;
    ssl_certificate_key /etc/nginx/ssl/sebela.dev/replace-with-the-certificate-key;
    return 301 https://sebela.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sebela.dev;

    ssl_certificate /etc/nginx/ssl/sebela.dev/replace-with-the-certificate;
    ssl_certificate_key /etc/nginx/ssl/sebela.dev/replace-with-the-certificate-key;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;

    # The visitor's address behind Bunny CDN: every request arrives from a CDN edge, so without this
    # the request budget below would count per edge, not per visitor. Bunny sends the visitor's
    # address in `X-Real-IP`; nginx trusts it only from Bunny's edge addresses (one
    # `set_real_ip_from` line per published edge address, kept current by
    # infra/scripts/bunny-edge-addresses.sh), and a request from anywhere else keeps its own
    # address. In this server block, not the http context, so other sites on the server keep theirs.
    include /etc/nginx/bunny-edge-addresses.conf;
    real_ip_header X-Real-IP;

    # Request limits: the website takes no uploads (media go through the API, which is not public),
    # so bodies stay small, and slow clients are cut off.
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_req zone=sebela_web burst=40 nodelay;

    # Security headers, on every response including errors. The website sends its own
    # `X-Robots-Tag` while indexing is off (WEB_INDEXING).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # The shared-cache rule above, on every answer. In the server block next to the security
    # headers, because an `add_header` in a location would drop them all.
    add_header Cache-Control $sebela_cache_control always;

    # Compression of text responses.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
        application/xml application/rss+xml image/svg+xml;

    # The website's own cache-invalidation endpoint is called by the API inside the Compose network,
    # never from outside.
    location ^~ /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://sebela_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Its rightmost entry is the visitor's address resolved above; the website's chat relay
        # names that entry to the API (WEB_TRUSTED_PROXY_HOPS=1) and ignores those further left.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # Replaced by the shared-cache rule (server block), which keeps the website's value
        # unless the answer is a cacheable page or a navigation. No `add_header` here: it would drop
        # the server block's, and every answer would leave without Cache-Control.
        proxy_hide_header Cache-Control;
    }
}
