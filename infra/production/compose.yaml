# Production overrides of the root compose.yaml (infra/README.md, docs/release-workflow.md): the same
# services, networks, volumes and health checks, run from the published images instead of local
# builds. Used together with the root file and the server's production environment file, whose
# every setting is documented, as a placeholder, in infra/production/.env.example:
#
#   docker compose --file compose.yaml --file infra/production/compose.yaml \
#     --env-file <production environment file> up --detach --wait
#
# - Every service starts without a profile: Postgres, the one-off migration, the API, the website
#   and MCP Admin. The migration and the API run the API image, so a release migrates with the very
#   image it then runs. The AI service keeps its profile `ai-service` until the release pipeline
#   deploys its image; without it the chat stays off.
# - Images come from GHCR by a tag per service (API_IMAGE_TAG, WEB_IMAGE_TAG, MCP_ADMIN_IMAGE_TAG),
#   so a release changes only the services it rebuilt. Nothing is built on the server.
# - Only the website is published, on WEB_HOST and WEB_PORT (the host's loopback interface, where
#   the server's nginx proxies to it). Postgres, the API and MCP Admin have no host port: the
#   website and MCP Admin reach the API inside the Compose networks.
# - Long-running services restart unless stopped; every container logs to rotated json-file logs.
# - The website's settings, including analytics (WEB_ANALYTICS_SCRIPT_URL and
#   WEB_ANALYTICS_WEBSITE_ID, off when unset) and indexing (WEB_INDEXING=on), pass through
#   compose.yaml unchanged.

# Its own project: the root compose.yaml names its project `sebela`, the development stack that every
# checkout and worktree shares, possibly on the same host. A later file's `name` wins, so production
# never adopts the development containers or the `postgres-data` volume.
name: sebela-production

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    # Compose interpolates the root file before it applies these overrides, so POSTGRES_HOST and
    # POSTGRES_PORT must still be set; nothing publishes them.
    ports: !reset []
    logging: *logging
    restart: unless-stopped

  migrate:
    profiles: !reset []
    build: !reset null
    image: ghcr.io/sebelapetr/sebela-api:${API_IMAGE_TAG:?set API_IMAGE_TAG (infra/production/.env.example)}
    logging: *logging
    restart: "no"

  api:
    profiles: !reset []
    build: !reset null
    image: ghcr.io/sebelapetr/sebela-api:${API_IMAGE_TAG:?set API_IMAGE_TAG (infra/production/.env.example)}
    ports: !reset []
    logging: *logging
    restart: unless-stopped

  web:
    profiles: !reset []
    build: !reset null
    image: ghcr.io/sebelapetr/sebela-web:${WEB_IMAGE_TAG:?set WEB_IMAGE_TAG (infra/production/.env.example)}
    ports: !override
      - "${WEB_HOST:?set WEB_HOST (infra/production/.env.example)}:${WEB_PORT:?set WEB_PORT (infra/production/.env.example)}:8080"
    logging: *logging
    restart: unless-stopped

  mcp-admin:
    profiles: !reset []
    build: !reset null
    image: ghcr.io/sebelapetr/sebela-mcp-admin:${MCP_ADMIN_IMAGE_TAG:?set MCP_ADMIN_IMAGE_TAG (infra/production/.env.example)}
    # Only on the host's loopback interface, as the target of the owner's SSH tunnel; nginx never
    # proxies to it, so it has no public address. Authentication still applies to every request.
    ports: !override
      - "${MCP_ADMIN_HOST:?set MCP_ADMIN_HOST (infra/production/.env.example)}:${MCP_ADMIN_PORT:?set MCP_ADMIN_PORT (infra/production/.env.example)}:8080"
    logging: *logging
    restart: unless-stopped

  # The AI service behind the chat. It stays behind its profile `ai-service` (no `!reset`) until the
  # release pipeline publishes and deploys its image: a deploy that knows only the API, website and
  # MCP Admin images neither pulls nor starts it, and the chat stays off. Start it with
  # `--profile ai-service`, its AI_SERVICE_IMAGE_TAG and the chat settings. No host port: only the
  # API reaches it, inside the chat network.
  ai-service:
    build: !reset null
    image: ghcr.io/sebelapetr/sebela-ai-service:${AI_SERVICE_IMAGE_TAG:-}
    logging: *logging
    restart: unless-stopped
