packages:
  - apps/*
  - packages/*

# Refuse to install on a Node.js version outside the declared engines range.
engineStrict: true

# Dependency build scripts that were reviewed. esbuild's install script only checks for the native
# binary, which its platform package already provides, so it does not need to run.
allowBuilds:
  esbuild: false

# pdfjs-dist renders pages with this optional native canvas; the API only extracts text, so it is
# not installed. The exclusion is workspace-wide: it also drops the optional canvas of the older
# pdfjs-dist under promptfoo's pdf-parse (dev only), which keeps its own direct canvas dependency.
ignoredOptionalDependencies:
  - "@napi-rs/canvas"

# drizzle-kit 0.31.11, the latest stable release, loads its configuration through
# @esbuild-kit/esm-loader, whose @esbuild-kit/core-utils (last released 3.3.2) pins esbuild
# ~0.18.20, affected by GHSA-67mh-4wv8-2f99 (fixed in 0.25.0). The override moves only that
# dependency edge to the esbuild that drizzle-kit itself uses; it only uses esbuild's transform
# API, which is unchanged. Remove it once drizzle-kit no longer depends on @esbuild-kit.
overrides:
  "@esbuild-kit/core-utils>esbuild": ^0.25.12

# One version of each shared tool for the whole workspace. Packages refer to it with `catalog:`.
catalog:
  "@eslint/js": 10.0.1
  "@hono/node-server": 2.1.8
  "@types/node": 26.6.6
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  eslint: 10.15.0
  globals: 17.14.0
  hono: 4.13.18
  lucide-react: 1.73.0
  next: 16.4.6
  prettier: 3.10.1
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: 4.3.5
  turbo: 2.11.11
  typescript: 6.0.3
  typescript-eslint: 8.73.0
  vitest: 5.1.0
  zod: 4.6.7
