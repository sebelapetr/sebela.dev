# openapi-python-client settings for the generated content client (pnpm --filter
# @sebela/llm-agent generate). The post hooks format the output with Ruff's defaults, independent
# of the package's own Ruff settings, so the generated files are the same everywhere.
project_name_override: content_api
package_name_override: content_api
post_hooks:
  - "ruff check --isolated --fix-only --extend-select=I ."
  - "ruff format --isolated ."
