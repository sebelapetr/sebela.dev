    <path d="M132 377H756" stroke="#E5E5E5" stroke-width="2"/>
    <path d="M844 377H1468" stroke="#262626" stroke-width="2"/>
    <text x="132" y="464" fill="#0A0A0A" font-size="38" font-weight="700">Software. Systems.</text>
    <text x="132" y="511" fill="#0A0A0A" font-size="38" font-weight="700">Applied curiosity.</text>
    <text x="844" y="464" fill="#EDEDED" font-size="38" font-weight="700">Software. Systems.</text>
    <text x="844" y="511" fill="#EDEDED" font-size="38" font-weight="700">Applied curiosity.</text>
    <path d="M132 555H502M132 577H438" stroke="#E5E5E5" stroke-width="10"/>
