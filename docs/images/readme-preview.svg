<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Website preview placeholder</title>
  <desc id="description">A monochrome placeholder for a future side-by-side homepage screenshot in light and dark mode. The website is in planning.</desc>
  <rect width="1600" height="900" fill="#F5F5F5"/>
