# Paid model evals: only the suites a change affects, and not on every push (docs/testing.md,
# Evals-driven development). The phase loop opens a phase pull request as a draft, which runs no
# evals; the owner marks it ready for review when the phase is complete, HITL work included, and
# that runs them once on the final state. Each suite has its own job and its own paths: its folder and what can
# change its behaviour. A suite runs in full on a pull request into the main branch when it is
# opened, reopened or marked ready for review and the pull request changes one of its paths, and
# by hand (workflow_dispatch, one suite or all). New commits on the pull request start no charged
# run; start one by hand when a fix needs it. Issue pull requests into phase branches never run
# paid evals; developers run the affected cases locally, where the eval command reads the key from
# the main checkout's .env.secrets. The key comes from the repository secret ANTHROPIC_API_KEY and
# is given only to the step that runs the evals.
name: Model evals

on:
  pull_request:
    branches:
      - master
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      suite:
        description: Which eval suite to run
        type: choice
        options: [all, mcp-admin, llm-agent]
        default: all
      allowance:
        description: >-
          Python agent (llm-agent): the remaining USD allowance of its eval campaign
          (.plan/06-llm-agent/evals.md). Required when that suite runs; the run spends at most this.
        type: string
        required: false

permissions:
  contents: read

jobs:
  # Which suites the pull request affects. A manual run selects them by its input instead.
  changes:
    name: Affected eval suites
    # A draft pull request runs no evals: the phase is not complete yet.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      mcp-admin: ${{ steps.affected.outputs.mcp-admin }}
      llm-agent: ${{ steps.affected.outputs.llm-agent }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: affected
        env:
          EVENT: ${{ github.event_name }}
          SUITE: ${{ inputs.suite }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          affected() {
            local name="$1" pattern="$2"
            if [ "$EVENT" = "workflow_dispatch" ]; then
              if [ "$SUITE" = "all" ] || [ "$SUITE" = "$name" ]; then echo "$name=true"; else echo "$name=false"; fi
            elif git diff --name-only "$BASE"...HEAD | grep -qE "$pattern"; then
              echo "$name=true"
            else
              echo "$name=false"
            fi
          }
          # MCP Admin: its app, the API it calls, the contracts and client between them, the
          # services and database behind the API, the lockfile and this workflow.
          affected mcp-admin '^(apps/mcp-admin/|apps/api/|packages/(contracts|api-client|services|db)/|pnpm-lock\.yaml$|\.github/workflows/model-evals\.yml$)' >> "$GITHUB_OUTPUT"
          # Python agent: its package, the API its evals read through (and what is behind it), the
          # contract its content client is generated from, the Python toolchain and lockfiles and
          # this workflow.
          affected llm-agent '^(packages/llm-agent/|apps/api/|packages/(contracts|api-client|services|db)/|pyproject\.toml$|uv\.lock$|\.python-version$|pnpm-lock\.yaml$|\.github/workflows/model-evals\.yml$)' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  mcp-admin:
    name: MCP Admin model evals
    needs: changes
    if: needs.changes.outputs.mcp-admin == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      POSTGRES_PASSWORD: ci-only-disposable-password
      DATABASE_PASSWORD: ci-only-disposable-password
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Postgres for the evals' API
        run: docker compose --env-file .env.example up --detach --wait
      - name: Build MCP Admin, the API and what they depend on
        run: pnpm --filter "@sebela/mcp-admin..." --filter "@sebela/api..." build
      - name: Model evals and their gate (the complete catalogue)
        working-directory: apps/mcp-admin
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::The repository secret ANTHROPIC_API_KEY is not set."
            exit 1
          fi
          node evals/run.js
      - name: Redacted eval summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mcp-admin-evals
          path: |
            .tmp/evals/mcp-admin/*/summary.json
          if-no-files-found: ignore

  # The Python chat agent (packages/llm-agent): every implemented case, 3 repeats each, with its
  # gates. Cases still pending are listed in the report and never pass. The run spends at most the
  # declared remaining campaign allowance: the manual run's `allowance` input, or the repository
  # variable LLM_AGENT_EVAL_ALLOWANCE_USD on a pull request. A fresh CI runner has no ledger, so
  # without a declared allowance the job is a visible block, never a fresh USD 10, and the job log
  # names the new remainder the owner must store in the variable after the run.
  llm-agent:
    name: Python agent model evals
    needs: changes
    if: needs.changes.outputs.llm-agent == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      POSTGRES_PASSWORD: ci-only-disposable-password
      DATABASE_PASSWORD: ci-only-disposable-password
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v10
        with:
          version-file: pyproject.toml
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --all-packages
      - name: Postgres for the evals' API
        run: docker compose --env-file .env.example up --detach --wait
      - name: Build the API and what it depends on
        run: pnpm --filter "@sebela/api..." build
      - name: Model evals and their gates (every implemented case)
        working-directory: packages/llm-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALLOWANCE: ${{ inputs.allowance || vars.LLM_AGENT_EVAL_ALLOWANCE_USD }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::The repository secret ANTHROPIC_API_KEY is not set."
            exit 1
          fi
          if [ -z "$ALLOWANCE" ]; then
            echo "::error::No remaining campaign allowance is declared (input allowance or variable LLM_AGENT_EVAL_ALLOWANCE_USD)."
            exit 1
          fi
          uv run --locked python -m evals.run --all --allowance "$ALLOWANCE"
      # The runner has no ledger here, so the declared allowance is the only record of what remains.
      # The owner sets LLM_AGENT_EVAL_ALLOWANCE_USD to this value after every run (or passes it as
      # the next dispatch input); otherwise the next run could spend the same allowance again.
      - name: Remaining campaign allowance for the next run
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          for summary in .tmp/evals/llm-agent/*/summary.json; do
            python3 -c 'import json, sys
          cost = json.load(open(sys.argv[1])).get("cost") or {}
          print("::notice title=llm-agent eval allowance::spent {} USD (uncertain {}); set LLM_AGENT_EVAL_ALLOWANCE_USD to {} before the next run".format(cost.get("spent_usd", "unknown"), cost.get("uncertain_usd", "unknown"), cost.get("remaining_usd", "unknown")))' "$summary"
          done
      - name: Redacted eval summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: llm-agent-evals
          path: |
            .tmp/evals/llm-agent/*/summary.json
          if-no-files-found: ignore
