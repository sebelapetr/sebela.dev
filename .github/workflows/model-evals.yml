# Paid model evals: only on a phase pull request or by hand, only the suites a change affects, and
# not on every push (docs/testing.md, Evals-driven development). They start by themselves only on a
# phase pull request, head branch phase/<phase-folder> into the main branch, when it is opened,
# reopened or marked ready for review and is not a draft; the suites it affects then run in full.
# The phase loop opens a phase pull request as a draft, which runs no evals; the owner marks it
# ready for review when the phase is complete, HITL work included, and that runs them once on the
# final state. New commits on the pull request start no charged run. Every other pull request
# (a fix, a dependency update, documentation) starts none, whatever it changes: the job
# `Affected eval suites` ends green without selecting a suite (scripts/checks/paid-evals-trigger.mjs).
# When such a change, or a fix on a phase pull request, needs a suite, start it by hand
# (workflow_dispatch, one suite or all: Actions, Model evals, Run workflow, or
# `gh workflow run model-evals.yml --ref <branch> -f suite=<suite>`); every run is charged. Each
# suite has its own job and its own paths: its folder and what can change its behaviour. Issue pull
# requests into phase branches never run paid evals; developers run the affected cases locally,
# where the eval command reads the key from the main checkout's .env.secrets. The key comes from
# the repository secret ANTHROPIC_API_KEY and is given only to the step that runs the evals.
name: Model evals

on:
  pull_request:
    branches:
      - master
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      suite:
        description: Which eval suite to run
        type: choice
        options: [all, mcp-admin, llm-agent]
        default: all
      allowance:
        description: >-
          Python agent (llm-agent): the remaining USD allowance of the named eval campaign.
          Required when that suite runs; the run spends at most this.
        type: string
        required: false
      campaign:
        description: >-
          Python agent (llm-agent): the phase campaign the run spends from, named after its phase
          folder (for example 07-ai-service; packages/llm-agent/evals/budget.py). Required when
          that suite runs; there is no default campaign.
        type: string
        required: false
      stage:
        description: >-
          Python agent (llm-agent): issue (bound by the campaign's stops for issue runs) or
          phase-pr (the full run of a phase pull request and its affected rerun).
        type: choice
        options: [issue, phase-pr]
        default: issue

permissions:
  contents: read

jobs:
  # Which suites the pull request affects: none unless it is a phase pull request. A manual run
  # selects them by its input instead.
  changes:
    name: Affected eval suites
    # A draft pull request runs no evals: the phase is not complete yet.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      mcp-admin: ${{ steps.affected.outputs.mcp-admin }}
      llm-agent: ${{ steps.affected.outputs.llm-agent }}
      # The eval campaign of a phase pull request: its phase folder, validated by the trigger check.
      campaign: ${{ steps.trigger.outputs.campaign }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Only a phase pull request (head branch phase/<phase-folder>) or a manual run may start paid
      # evals. On any other pull request the next step is skipped, so no suite is selected and
      # every suite's job is skipped. The head branch is passed as an environment variable, never
      # written into a shell line.
      - id: trigger
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/checks/paid-evals-trigger.mjs >> "$GITHUB_OUTPUT"
      - id: affected
        if: steps.trigger.outputs.paid-evals == 'true'
        env:
          EVENT: ${{ github.event_name }}
          SUITE: ${{ inputs.suite }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          affected() {
            local name="$1" pattern="$2"
            if [ "$EVENT" = "workflow_dispatch" ]; then
              if [ "$SUITE" = "all" ] || [ "$SUITE" = "$name" ]; then echo "$name=true"; else echo "$name=false"; fi
            elif git diff --name-only "$BASE"...HEAD | grep -qE "$pattern"; then
              echo "$name=true"
            else
              echo "$name=false"
            fi
          }
          # MCP Admin: its app, its job below, and the routes it calls in the API contract, the API
          # client and their locked dependencies, decided by scripts/checks/mcp-admin-evals-affected.mjs
          # (docs/testing.md, CI). A route added for another consumer does not run it.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            affected mcp-admin '' >> "$GITHUB_OUTPUT"
          else
            node scripts/checks/mcp-admin-evals-affected.mjs "$BASE" HEAD >> "$GITHUB_OUTPUT"
          fi
          # Python agent: its package, the API its evals read through (and what is behind it), the
          # contract its content client is generated from, the Python toolchain and lockfiles and
          # this workflow.
          affected llm-agent '^(packages/llm-agent/|apps/api/|packages/(contracts|api-client|services|db)/|pyproject\.toml$|uv\.lock$|\.python-version$|pnpm-lock\.yaml$|\.github/workflows/model-evals\.yml$)' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  mcp-admin:
    name: MCP Admin model evals
    needs: changes
    if: needs.changes.outputs.mcp-admin == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      POSTGRES_PASSWORD: ci-only-disposable-password
      DATABASE_PASSWORD: ci-only-disposable-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Postgres for the evals' API
        run: docker compose --env-file .env.example up --detach --wait
      - name: Build MCP Admin, the API and what they depend on
        run: pnpm --filter "@sebela/mcp-admin..." --filter "@sebela/api..." build
      - name: Model evals and their gate (the complete catalogue)
        working-directory: apps/mcp-admin
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::The repository secret ANTHROPIC_API_KEY is not set."
            exit 1
          fi
          node evals/run.js
      - name: Redacted eval summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-admin-evals
          path: |
            .tmp/evals/mcp-admin/*/summary.json
          if-no-files-found: ignore

  # The Python chat agent (packages/llm-agent): every implemented case, 3 repeats each, with its
  # gates. Cases still pending are listed in the report and never pass. The run names its phase
  # campaign, which has its own ceiling (packages/llm-agent/evals/budget.py; decision 0026): on a
  # phase pull request the phase folder of its head branch phase/<phase-folder>, named by the
  # trigger check of the `changes` job, at the stage `phase-pr`; on a manual run the `campaign`
  # and `stage` inputs. A missing or unknown campaign is a visible block; no run falls back to
  # another campaign's ceiling. The run spends at most the
  # declared remaining allowance of that campaign: the manual run's `allowance` input, or the
  # repository variable LLM_AGENT_EVAL_ALLOWANCE_USD on a pull request, which the owner sets to
  # the campaign's remainder before marking the phase pull request ready. A fresh CI runner has no
  # ledger, so without a declared allowance the job is a visible block, never a fresh ceiling, and
  # the job log names the new remainder the owner must store in the variable after the run.
  # Wall time: the runner stops starting chunks after its 150-minute deadline; the chunk under way
  # still finishes (at most about 76 minutes: its subject runs plus a 60-minute batch wait and a
  # 10-minute cancel wait), so the eval step is bounded at 240 minutes and the job at 270, below
  # the platform's 6-hour kill, and the allowance notice and the summary upload always run.
  llm-agent:
    name: Python agent model evals
    needs: changes
    if: needs.changes.outputs.llm-agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 270
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      POSTGRES_PASSWORD: ci-only-disposable-password
      DATABASE_PASSWORD: ci-only-disposable-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
          resolution-strategy: lowest
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --all-packages
      - name: Postgres for the evals' API
        run: docker compose --env-file .env.example up --detach --wait
      - name: Build the API and what it depends on
        run: pnpm --filter "@sebela/api..." build
      - name: Model evals and their gates (every implemented case)
        working-directory: packages/llm-agent
        timeout-minutes: 240
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALLOWANCE: ${{ inputs.allowance || vars.LLM_AGENT_EVAL_ALLOWANCE_USD }}
          EVENT: ${{ github.event_name }}
          PHASE_CAMPAIGN: ${{ needs.changes.outputs.campaign }}
          CAMPAIGN_INPUT: ${{ inputs.campaign }}
          STAGE_INPUT: ${{ inputs.stage }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::The repository secret ANTHROPIC_API_KEY is not set."
            exit 1
          fi
          if [ -z "$ALLOWANCE" ]; then
            echo "::error::No remaining campaign allowance is declared (input allowance or variable LLM_AGENT_EVAL_ALLOWANCE_USD)."
            exit 1
          fi
          # On a phase pull request the campaign is the phase folder the trigger check validated;
          # the runner refuses a name that is not a known campaign.
          if [ "$EVENT" = "pull_request" ]; then
            CAMPAIGN="$PHASE_CAMPAIGN"
            STAGE="phase-pr"
          else
            CAMPAIGN="$CAMPAIGN_INPUT"
            STAGE="${STAGE_INPUT:-issue}"
          fi
          if [ -z "$CAMPAIGN" ]; then
            echo "::error::No eval campaign is named (input campaign, or the phase folder of a phase pull request)."
            exit 1
          fi
          uv run --locked python -m evals.run --all --campaign "$CAMPAIGN" --stage "$STAGE" --allowance "$ALLOWANCE"
      # The runner has no ledger before the run, so the declared allowance is the only record of
      # what remains. The owner sets LLM_AGENT_EVAL_ALLOWANCE_USD to this value after every run (or
      # passes it as the next dispatch input); otherwise the next run could spend the same allowance
      # again. A run killed before its summary is read from the ledger it wrote before every chunk,
      # which counts the unfinished chunk at its whole reservation.
      - name: Remaining campaign allowance for the next run
        if: ${{ always() }}
        env:
          ALLOWANCE: ${{ inputs.allowance || vars.LLM_AGENT_EVAL_ALLOWANCE_USD }}
        run: |
          python3 -c 'import glob, json, os
          notice = "::notice title=llm-agent eval allowance::spent {} USD (uncertain {}); set LLM_AGENT_EVAL_ALLOWANCE_USD to {} before the next run"
          summaries = sorted(glob.glob(".tmp/evals/llm-agent/*/summary.json"))
          for path in summaries:
              cost = json.load(open(path)).get("cost") or {}
              print(notice.format(cost.get("spent_usd", "unknown"), cost.get("uncertain_usd", "unknown"), cost.get("remaining_usd", "unknown")))
          ledger = ".tmp/evals/llm-agent/ledger.json"
          if not summaries and os.path.exists(ledger):
              runs = json.load(open(ledger)).get("runs", [])
              spent = sum(float(run.get("spent_usd", 0)) for run in runs)
              uncertain = sum(float(run.get("uncertain_usd", 0)) for run in runs)
              declared = os.environ.get("ALLOWANCE") or ""
              remaining = round(float(declared) - spent, 6) if declared else "unknown"
              print(notice.format(round(spent, 6), round(uncertain, 6), remaining) + " (no summary: read from the ledger)")'
      - name: Redacted eval summary
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llm-agent-evals
          path: |
            .tmp/evals/llm-agent/*/summary.json
            .tmp/evals/llm-agent/ledger.json
          if-no-files-found: ignore
