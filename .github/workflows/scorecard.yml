# OpenSSF Scorecard: the supply-chain checks of github.com/ossf/scorecard on master, weekly, on every
# push to master and by hand. The result goes to code scanning (Security tab) and is published to
# api.scorecard.dev for the README badge. Follows the public example of ossf/scorecard-action; the
# Scorecard API accepts published results only from a workflow without top-level write permissions,
# env or defaults, and whose analysis job uses only the approved actions (docs/testing.md, "CI").
name: Scorecard

on:
  # For the Branch-Protection check; only the default branch is supported.
  branch_protection_rule:
  # Keeps the Maintained check current.
  schedule:
    - cron: "15 14 * * 0"
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Blocks all cache access, as in the action's example workflow.
cache-mode: none

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Scorecard supports only the default branch.
    if: ${{ github.event.repository.default_branch == github.ref_name }}
    permissions:
      security-events: write # upload the SARIF result to code scanning
      id-token: write # sign the results published to api.scorecard.dev
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
