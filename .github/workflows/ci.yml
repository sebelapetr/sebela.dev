# Minimal CI for phase 0: runs the harness tests. Phase 1 replaces it with the full pipeline.
name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "phase/**"

permissions:
  contents: read

jobs:
  harness:
    name: Harness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: node --test scripts/harness/
