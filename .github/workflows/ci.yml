# Quality gate for every pull request and for pushes to the main branch.
# Node.js comes from .nvmrc and pnpm from the packageManager field of package.json. Every job runs on
# every event; none is skipped by a path filter, so no required status is ever left waiting.
# Documentation never counts as a change of an app or package: the quality job runs no package task
# and the two website jobs report success at once for a change of documentation alone
# (docs/testing.md, "CI", "Documentation" and "Website jobs").
# What each job checks: docs/testing.md ("CI").
name: CI

on:
  pull_request:
  # Pushes to master only: a phase branch changes through issue pull requests, which ran CI on
  # their merge with it, and its open phase pull request runs CI again on every push. A push run
  # there too would check the same commit twice.
  push:
    branches:
      - master
  # Started by the release workflow on the changelog pull request it opens, which, opened with
  # GITHUB_TOKEN, starts no pull_request run of its own; `base` is the master commit the branch was
  # cut from, the comparison a pull_request run would use (docs/release-workflow.md, Changelog).
  workflow_dispatch:
    inputs:
      base:
        description: Commit to compare the branch with (empty runs every job in full)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # Required status check. Runs with plain Node and no installed dependencies, which keeps the
  # harness independent of the application toolchain.
  harness:
    name: Harness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node --test harness/

  # Guard rail: no port, local host address or database name hard-coded in executable files. Plain
  # Node without installed dependencies, so it reports on its own even when the toolchain fails.
  # The quality job runs the same check and tests through Turborepo.
  config-check:
    name: Hard-coded configuration check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/
      - run: node scripts/checks/hardcoded-config.mjs
      # The private terms are a repository secret, never in the repository (docs/permissions.md).
      - run: node scripts/checks/private-terms.mjs
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}

  # The root checks on every run, then lint (including the import-boundaries rule), typecheck, test
  # and build of the packages the change affects, documentation not counted. The comparison base is
  # the pull request's base or the commit before the push; full history makes it resolvable. When
  # Turborepo cannot resolve it (a new branch, a rewritten history) it treats every package as
  # affected.
  # The backend integration tests need a real Postgres: the `postgres` service of compose.yaml, with
  # the documented settings of .env.example and a password that exists only in this job. Each test
  # file creates and drops its own temporary database in it.
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || inputs.base }}
      TURBO_SCM_HEAD: HEAD
      POSTGRES_PASSWORD: ci-only-disposable-password
      DATABASE_PASSWORD: ci-only-disposable-password
      # Every test run below measures coverage (docs/testing.md, Coverage); no figure fails a step.
      TEST_COVERAGE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Postgres for the integration tests
        run: docker compose --env-file .env.example up --detach --wait
      # Documentation is no change of an app or package (docs/testing.md, CI): from here on
      # Turborepo compares the base with the head without its documentation changes, a commit
      # made for this run. With no resolvable base it stays HEAD, and every package is affected.
      - name: The change without its documentation
        run: |
          head=$(node scripts/checks/without-documentation.mjs head "$TURBO_SCM_BASE")
          echo "TURBO_SCM_HEAD=$head" >> "$GITHUB_ENV"
      - name: Affected packages and why
        run: pnpm exec turbo query affected --packages
      - name: Root checks (root lint, hard-coded configuration, harness and check tests)
        run: pnpm ci:root
      - name: Affected package tasks (lint, typecheck, test, build)
        run: pnpm ci:affected
      # On every run, not only when the API is affected: regenerates the OpenAPI document and the
      # client from the API source (no database or secrets) and fails on any difference from the
      # committed files.
      - name: Generated API client matches the API
        run: pnpm check:api-client
      # The published coverage figure covers every package: on a push to master the tests of the
      # packages the push did not affect run too. Those tested above are cache hits, their coverage
      # reports already on disk. A pull request shows the coverage of what it ran.
      - name: Tests of every package, for the full coverage figure (master only)
        if: github.event_name == 'push'
        run: pnpm exec turbo run test
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/checks/coverage-summary.mjs --json "$RUNNER_TEMP/coverage/coverage-summary.json"
      - name: Coverage figures (master only)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage/coverage-summary.json
          retention-days: 90

  # The website in a browser: Playwright runs the built website against the API's end-to-end server,
  # a real API on a temporary database of the job's Postgres seeded from small fictional fixtures,
  # and checks content, the missing-photo and unavailable states, keyboard order, accessibility and
  # no horizontal scroll at 360, 768 and 1280 px in light and dark mode. On every change except one
  # that touches only files that cannot change the website: a change to the API, the contracts or
  # the shared packages can break what the website reads. The screenshots are kept as an artifact.
  web-e2e:
    name: Website end to end
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      POSTGRES_PASSWORD: ci-only-disposable-password
      DATABASE_PASSWORD: ci-only-disposable-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      # Success at once, without a browser, when every changed file is documentation
      # (scripts/checks/without-documentation.mjs: Markdown anywhere, docs/ and .plan/, but not
      # Markdown that code reads) or one that cannot change the website: agent configuration, the
      # harness, the MCP and AI apps and packages, and the eval and commit-message workflows.
      # Anything else, a new branch or an unknown base runs the job in full.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Website affected
        id: website
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || inputs.base }}
        run: |
          unaffected='^(\.claude/|harness/|apps/(mcp-admin|mcp-public|ai-service)/|packages/(llm-agent|memory)/|\.github/workflows/(model-evals|commit-messages)\.yml$)'
          if ! changed=$(node scripts/checks/without-documentation.mjs files "$BASE"); then
            echo "No comparison base: the website job runs in full."
            echo "affected=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$changed" ] || ! printf '%s\n' "$changed" | grep -qvE "$unaffected"; then
            echo "Only documentation and files that cannot change the website changed; nothing to run."
            echo "affected=false" >> "$GITHUB_OUTPUT"
          else
            echo "affected=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.website.outputs.affected == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.website.outputs.affected == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.website.outputs.affected == 'true'
        run: pnpm install --frozen-lockfile
      - name: Chromium for Playwright
        if: steps.website.outputs.affected == 'true'
        run: pnpm --filter @sebela/web exec playwright install --with-deps chromium
      - name: Postgres for the API's end-to-end server
        if: steps.website.outputs.affected == 'true'
        run: docker compose --env-file .env.example up --detach --wait
      - name: Browser tests (builds the website and the API first)
        if: steps.website.outputs.affected == 'true'
        run: pnpm test:e2e
      # Kept two weeks: for looking at a run's pages and failures, not as an archive.
      - name: Screenshots and reports
        if: ${{ !cancelled() && steps.website.outputs.affected == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # Real-Postgres lifecycle of the worktree databases: a disposable Compose project from
  # compose.yaml on a free port. Plain Node and Docker, no installed dependencies.
  worktree-databases:
    name: Worktree database lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node harness/worktree-databases.e2e.mjs

  # Backend setup of real worktrees: two worktrees of a temporary clone are installed, migrated,
  # given their own local storage folder and seeded, serve and accept uploads through their own API,
  # and are removed one by one. A disposable Compose project; no cloud keys.
  worktree-backend:
    name: Worktree backend setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: node harness/worktree-backend.e2e.mjs

  # The containerised API stack of compose.yaml (profile `api`): builds the API image, then checks
  # migration ordering, health, the OpenAPI document and reference, a seeded public read, a write
  # with a key from the CLI and a local media download, in a disposable Compose project with its own
  # volumes, removed at the end. Plain Node and Docker, no installed dependencies.
  api-stack:
    name: API stack smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/checks/api-stack.e2e.mjs

  # The production composition (compose.yaml with infra/production/compose.yaml): builds the API,
  # website and MCP Admin images under their GHCR names, checks them and the fixture image with the
  # image-content check, starts them from the production example settings with the demo seed, and
  # checks health, that only the website is published and only on loopback, noindex without
  # analytics, the website's health route with Postgres and then the API stopped, and that no secret
  # is logged. Removed at the end. Plain Node and Docker, no installed dependencies.
  production-stack:
    name: Production stack smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/checks/production-stack.e2e.mjs

  # The deployment script infra/scripts/deploy.sh against a disposable Compose project of tiny
  # busybox images committed per release (nothing is built): a first and a second healthy release,
  # a deliberately unhealthy one that ends with the second running again, a new migration refused
  # without a backup script, and the rollback command. Removed at the end. Plain Node and Docker.
  deployment:
    name: Simulated deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/release/deploy.e2e.mjs

  # The backup and restore round trip of infra/scripts/backup.sh and restore.sh against a
  # disposable Postgres of the production image with a fictional database owned by the application
  # role (pgvector column included), a key generated for the run and the fake storage zone: dump,
  # encrypt, upload and heartbeat; list, fetch, decrypt in the test, restore with equal row counts
  # and the same vectors, refuse an existing database without --replace, drop. Removed at the end.
  # Plain Node, Docker and age.
  backup:
    name: Backup and restore round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: age
        run: sudo apt-get update && sudo apt-get install --yes age
      - run: node scripts/release/backup.e2e.mjs

  # The complete containerised stack of compose.yaml (profiles `api` and `web`): two disposable
  # Compose projects side by side, each with its own ports, volumes, storage folder and secrets,
  # seeded with the fictional demo seed. Real pages, the CV PDF and stored images through the website
  # container, an authenticated edit the website shows at once, isolation of keys, files and signed
  # invalidations between the two, and the hero's question to the mock Ask page in Chromium with
  # screenshots kept as an artifact. Removed at the end. The dependencies are installed only for
  # Playwright; the stack itself is built from the images.
  web-stack:
    name: Website stack smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      # Success at once, without a browser, when every changed file is documentation
      # (scripts/checks/without-documentation.mjs: Markdown anywhere, docs/ and .plan/, but not
      # Markdown that code reads) or one that cannot change the website: agent configuration, the
      # harness, the MCP and AI apps and packages, and the eval and commit-message workflows.
      # Anything else, a new branch or an unknown base runs the job in full.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Website affected
        id: website
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || inputs.base }}
        run: |
          unaffected='^(\.claude/|harness/|apps/(mcp-admin|mcp-public|ai-service)/|packages/(llm-agent|memory)/|\.github/workflows/(model-evals|commit-messages)\.yml$)'
          if ! changed=$(node scripts/checks/without-documentation.mjs files "$BASE"); then
            echo "No comparison base: the website job runs in full."
            echo "affected=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$changed" ] || ! printf '%s\n' "$changed" | grep -qvE "$unaffected"; then
            echo "Only documentation and files that cannot change the website changed; nothing to run."
            echo "affected=false" >> "$GITHUB_OUTPUT"
          else
            echo "affected=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.website.outputs.affected == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.website.outputs.affected == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.website.outputs.affected == 'true'
        run: pnpm install --frozen-lockfile
      - name: Chromium for Playwright
        if: steps.website.outputs.affected == 'true'
        run: pnpm --filter @sebela/web exec playwright install --with-deps chromium
      - name: Two complete stacks
        if: steps.website.outputs.affected == 'true'
        run: pnpm test:web-stack
      - name: Screenshots
        if: ${{ !cancelled() && steps.website.outputs.affected == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-stack
          path: apps/web/test-results/complete-stack/
          if-no-files-found: ignore
          retention-days: 14
