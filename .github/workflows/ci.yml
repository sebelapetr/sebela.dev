# Quality gate for issue pull requests and for pushes to phase branches and the main branch.
# Node.js comes from .nvmrc and pnpm from the packageManager field of package.json.
name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "phase/**"

permissions:
  contents: read

jobs:
  # Required status check. Runs with plain Node and no installed dependencies, which keeps the
  # harness independent of the application toolchain.
  harness:
    name: Harness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/harness/

  # Guard rail: no port, local host address or database name hard-coded in executable files. Plain
  # Node without installed dependencies, so it reports on its own even when the toolchain fails.
  # `pnpm lint` and `pnpm test` in the quality job run the same check and tests.
  config-check:
    name: Hard-coded configuration check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/checks/
      - run: node scripts/checks/hardcoded-config.mjs

  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
