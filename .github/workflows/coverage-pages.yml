# The public coverage site on GitHub Pages: the README badge's shields.io endpoint, the coverage
# figures and a page (docs/testing.md, "Coverage"). It publishes what the full coverage run of CI's
# quality job on a push to master kept as the artifact `coverage`, so it runs no tests itself and
# leaves pull request runs untouched. It checks out nothing: the artifact holds only coverage
# figures and package names, written by scripts/checks/coverage-summary.mjs.
name: Coverage site

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master

# One deployment at a time; a newer run waits instead of cancelling one in progress.
concurrency:
  group: coverage-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish the coverage site
    # Only a successful push run of this repository's master. A pull request's CI run, even one
    # from a fork whose branch is called master, never publishes.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # Reading the CI run's artifact, then the Pages deployment, which signs in with OIDC.
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: The coverage site of the CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
