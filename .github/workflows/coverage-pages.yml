# The public coverage site on GitHub Pages: the README badge's shields.io endpoint, the coverage
# figures and a page (docs/testing.md, "Coverage"). It publishes what the full coverage run of CI's
# quality job on a push to master kept as the artifact `coverage`, so it runs no tests itself and
# leaves pull request runs untouched. It checks out nothing: the artifact holds only coverage
# figures and package names, written by scripts/checks/coverage-summary.mjs.
name: Coverage site

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master

# One deployment at a time; a newer run waits instead of cancelling one in progress.
concurrency:
  group: coverage-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Only a successful push run of this repository's master, and only one that kept the site: a push
  # of documentation alone keeps none (scripts/checks/coverage-full-run.mjs), and then nothing is
  # deployed and the published badge stays. A pull request's CI run, even one from a fork whose
  # branch is called master, never publishes.
  site:
    name: Coverage site of the CI run
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      kept: ${{ steps.artifact.outputs.kept }}
    steps:
      - name: Whether the run kept the coverage site
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "coverage" and (.expired | not))] | length')
          if [ "$count" -gt 0 ]; then
            echo "kept=true" >> "$GITHUB_OUTPUT"
          else
            echo "The run kept no coverage site (documentation alone changed): nothing to publish."
            echo "kept=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish the coverage site
    needs: site
    if: needs.site.outputs.kept == 'true'
    runs-on: ubuntu-latest
    # Reading the CI run's artifact, then the Pages deployment, which signs in with OIDC.
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: The coverage site of the CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
