# Release: on every push to master, build only the images the push affects, verify them as the
# running production stack and publish only verified images to GHCR (docs/release-workflow.md,
# "Images"). The decisions live in scripts/release/images.mjs and are tested with fixtures.
# The only credential is the job's GITHUB_TOKEN, which may write packages only in the job that
# publishes. A later job deploys the tag set of the `images` job (issue #234).
name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

# One release at a time, in push order: a later push must not move a `current` tag before an
# earlier one has finished.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Which services the push affects: Turborepo's affected packages between the commit before the
  # push and HEAD, the same selection as the quality job of CI, mapped to the api, web and
  # mcp-admin images. A push that affects none (docs only, a workflow alone) builds nothing, and
  # the jobs after this one are skipped.
  changes:
    name: Affected services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.affected.outputs.services }}
      build: ${{ steps.affected.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Affected services and why
        id: affected
        env:
          BASE: ${{ github.event.before }}
        run: node scripts/release/images.mjs affected >> "$GITHUB_OUTPUT"

  # Natively on arm64, as the server runs: builds the affected images tagged with the commit SHA,
  # pulls the current images of the unchanged services (building those that have none), starts them
  # all as the production composition with the demo seed and runs the production stack smoke check
  # with the complete-stack browser tests (the mock Ask page; no model is called). Only when that
  # passes are the built images pushed, the very images that were verified.
  images:
    name: Build, verify and publish the images
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.plan.outputs.tags }}
      built: ${{ steps.plan.outputs.build }}
    env:
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Sign in to GHCR with the job's token
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: What to build and what to reuse
        id: plan
        env:
          AFFECTED: ${{ needs.changes.outputs.services }}
        run: node scripts/release/images.mjs plan >> "$GITHUB_OUTPUT"
      - name: Build the images
        env:
          BUILD: ${{ steps.plan.outputs.build }}
        run: node scripts/release/images.mjs build
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium for Playwright
        run: pnpm --filter @sebela/web exec playwright install --with-deps chromium
      - name: Verify the stack from these images
        env:
          API_IMAGE_TAG: ${{ fromJSON(steps.plan.outputs.tags).api }}
          WEB_IMAGE_TAG: ${{ fromJSON(steps.plan.outputs.tags).web }}
          MCP_ADMIN_IMAGE_TAG: ${{ fromJSON(steps.plan.outputs.tags)['mcp-admin'] }}
        run: node scripts/checks/production-stack.e2e.mjs --images --browser
      - name: Screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-stack
          path: apps/web/test-results/complete-stack/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish the verified images
        env:
          BUILD: ${{ steps.plan.outputs.build }}
        run: node scripts/release/images.mjs publish
      - name: Release tag set
        env:
          TAGS: ${{ steps.plan.outputs.tags }}
        run: |
          {
            echo "### Image tags"
            echo
            echo '```json'
            printf '%s\n' "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
