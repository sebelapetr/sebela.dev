# Release: on every push to master, build only the images that changed since the current image of
# each service, verify them as the running production stack and publish only verified images to
# GHCR (docs/release-workflow.md, "Images"). The decisions live in scripts/release/images.mjs and
# are tested with fixtures. The only credential is the job's GITHUB_TOKEN; the Docker sign-in to
# GHCR exists only around the steps that read or write it. The `deploy` job then deploys the
# verified tag set to the server through the deploy user's forced SSH command and runs the
# production smoke check, and the `release` job tags the version, publishes a GitHub release with
# notes from Conventional Commits and the SBOMs and attestation bundles of the images built
# (scripts/release/release-files.mjs) and opens the pull request that adds the notes to
# CHANGELOG.md (docs/release-workflow.md, "Deployment", "Versions", "Release files" and
# "Changelog"). The workflow
# references no application secret: only the SSH key, host and known-host line of the `production`
# environment, and GITHUB_TOKEN.
name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

# One release at a time. GitHub keeps the running release and cancels a waiting one when a newer
# push queues; nothing is lost, because each release builds every service that changed since its
# current image, whatever earlier releases did.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # What to build and what to reuse: each service is compared with the commit of its current
  # image, through Turborepo's affected packages as in the quality job of CI. A push that changes
  # no image (docs only, a workflow alone) releases nothing, and the jobs after this one are
  # skipped. A current image newer than this commit fails the job, so an older release is never
  # published over a newer one.
  plan:
    name: Plan the images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tags: ${{ steps.plan.outputs.tags }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sign in to GHCR to read the current images
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: What to build and what to reuse
        id: plan
        env:
          SHA: ${{ github.sha }}
        run: node scripts/release/images.mjs plan >> "$GITHUB_OUTPUT"
      - name: Sign out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io

  # Natively on arm64, as the server runs: pulls the reused images, builds the planned ones tagged
  # with the commit SHA, starts them all as the production composition with the demo seed and runs
  # the production stack smoke check with the complete-stack browser tests (the Ask page with the
  # chat off, as without the AI service; no model is called). Only when that passes are the built images pushed, the very images that were
  # verified. Each pushed image then gets a signed SLSA build provenance attestation and an SPDX
  # SBOM attestation for its pushed digest, stored beside it in GHCR; the job's OIDC token
  # (`id-token: write`) signs them and `attestations: write` records them.
  images:
    name: Build, verify and publish the images
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      tags: ${{ needs.plan.outputs.tags }}
      built: ${{ needs.plan.outputs.build }}
      digests: ${{ steps.publish.outputs.digests }}
    env:
      SHA: ${{ github.sha }}
      BUILD: ${{ needs.plan.outputs.build }}
      TAGS: ${{ needs.plan.outputs.tags }}
    steps:
      # The whole history, so publishing can check that no newer image was published meanwhile.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Sign in to GHCR to pull the reused images
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Pull the reused images
        run: node scripts/release/images.mjs pull
      - name: Sign out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io
      - name: Build the images
        run: node scripts/release/images.mjs build
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium for Playwright
        run: pnpm --filter @sebela/web exec playwright install --with-deps chromium
      - name: Verify the stack from these images
        env:
          API_IMAGE_TAG: ${{ fromJSON(needs.plan.outputs.tags).api }}
          WEB_IMAGE_TAG: ${{ fromJSON(needs.plan.outputs.tags).web }}
          MCP_ADMIN_IMAGE_TAG: ${{ fromJSON(needs.plan.outputs.tags)['mcp-admin'] }}
        run: node scripts/checks/production-stack.e2e.mjs --images --browser
      - name: Screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-stack
          path: apps/web/test-results/complete-stack/
          if-no-files-found: ignore
          retention-days: 14
      - name: Sign in to GHCR to publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Publish the verified images
        id: publish
        run: node scripts/release/images.mjs publish >> "$GITHUB_OUTPUT"
      # For the images this run pushed (the output `digests`, service to pushed digest), while the
      # sign-in to GHCR lasts: the attestations are pushed to the registry beside the image.
      - name: SBOM of api
        if: ${{ fromJSON(steps.publish.outputs.digests).api }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/sebelapetr/sebela-api@${{ fromJSON(steps.publish.outputs.digests).api }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-api.spdx.json
          upload-artifact: false
      - name: SBOM attestation of api
        id: sbom-attestation-api
        if: ${{ fromJSON(steps.publish.outputs.digests).api }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/sebelapetr/sebela-api
          subject-digest: ${{ fromJSON(steps.publish.outputs.digests).api }}
          sbom-path: ${{ runner.temp }}/sbom-api.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Build provenance attestation of api
        id: provenance-api
        if: ${{ fromJSON(steps.publish.outputs.digests).api }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/sebelapetr/sebela-api
          subject-digest: ${{ fromJSON(steps.publish.outputs.digests).api }}
          push-to-registry: true
          create-storage-record: false
      - name: SBOM of web
        if: ${{ fromJSON(steps.publish.outputs.digests).web }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/sebelapetr/sebela-web@${{ fromJSON(steps.publish.outputs.digests).web }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-web.spdx.json
          upload-artifact: false
      - name: SBOM attestation of web
        id: sbom-attestation-web
        if: ${{ fromJSON(steps.publish.outputs.digests).web }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/sebelapetr/sebela-web
          subject-digest: ${{ fromJSON(steps.publish.outputs.digests).web }}
          sbom-path: ${{ runner.temp }}/sbom-web.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Build provenance attestation of web
        id: provenance-web
        if: ${{ fromJSON(steps.publish.outputs.digests).web }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/sebelapetr/sebela-web
          subject-digest: ${{ fromJSON(steps.publish.outputs.digests).web }}
          push-to-registry: true
          create-storage-record: false
      - name: SBOM of mcp-admin
        if: ${{ fromJSON(steps.publish.outputs.digests)['mcp-admin'] }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/sebelapetr/sebela-mcp-admin@${{ fromJSON(steps.publish.outputs.digests)['mcp-admin'] }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-mcp-admin.spdx.json
          upload-artifact: false
      - name: SBOM attestation of mcp-admin
        id: sbom-attestation-mcp-admin
        if: ${{ fromJSON(steps.publish.outputs.digests)['mcp-admin'] }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/sebelapetr/sebela-mcp-admin
          subject-digest: ${{ fromJSON(steps.publish.outputs.digests)['mcp-admin'] }}
          sbom-path: ${{ runner.temp }}/sbom-mcp-admin.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Build provenance attestation of mcp-admin
        id: provenance-mcp-admin
        if: ${{ fromJSON(steps.publish.outputs.digests)['mcp-admin'] }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/sebelapetr/sebela-mcp-admin
          subject-digest: ${{ fromJSON(steps.publish.outputs.digests)['mcp-admin'] }}
          push-to-registry: true
          create-storage-record: false
      - name: Sign out of GHCR after publishing
        if: ${{ always() }}
        run: docker logout ghcr.io
      # The files the GitHub release attaches for the images this run pushed (docs/release-workflow.md,
      # "Release files"): each SBOM and the Sigstore bundles of its two attestations, handed to the
      # release job as the artifact `release-files`. Only their presence is checked here, which the
      # attestation steps already ensure; the release job checks them against the pushed digests.
      - name: Collect the release files
        env:
          DIGESTS: ${{ steps.publish.outputs.digests }}
          FILES_DIR: ${{ runner.temp }}/release-files
          SBOM_API: ${{ runner.temp }}/sbom-api.spdx.json
          PROVENANCE_API: ${{ steps.provenance-api.outputs.bundle-path }}
          SBOM_ATTESTATION_API: ${{ steps.sbom-attestation-api.outputs.bundle-path }}
          SBOM_WEB: ${{ runner.temp }}/sbom-web.spdx.json
          PROVENANCE_WEB: ${{ steps.provenance-web.outputs.bundle-path }}
          SBOM_ATTESTATION_WEB: ${{ steps.sbom-attestation-web.outputs.bundle-path }}
          SBOM_MCP_ADMIN: ${{ runner.temp }}/sbom-mcp-admin.spdx.json
          PROVENANCE_MCP_ADMIN: ${{ steps.provenance-mcp-admin.outputs.bundle-path }}
          SBOM_ATTESTATION_MCP_ADMIN: ${{ steps.sbom-attestation-mcp-admin.outputs.bundle-path }}
        run: node scripts/release/release-files.mjs collect
      - name: Hand the release files to the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files/
          if-no-files-found: error
          retention-days: 14
      - name: Release tag set
        run: |
          {
            echo "### Image tags"
            echo
            echo '```json'
            printf '%s\n' "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The release commit and the verified tag set reach the server only as the input of the deploy
  # user's forced command, infra/scripts/deploy.sh, which validates them again, brings its checkout
  # to the release commit (only a commit on master), backs up before a new migration, migrates,
  # recreates the services, waits for health and returns to the previous release on failure. The
  # GitHub Environment `production` is restricted to master and holds the only secrets: the deploy
  # key, the host and its known_hosts line. The smoke check then asks the public edge with a made-up
  # key; no application secret is used here.
  deploy:
    name: Deploy to production
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://sebela.dev
    permissions:
      contents: read
    env:
      SHA: ${{ github.sha }}
      TAGS: ${{ needs.images.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: SSH key and known host
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        # The runner context is not available in a job's env, so the folder is set here for the
        # steps that follow.
        run: |
          SSH_DIR="$RUNNER_TEMP/ssh"
          echo "SSH_DIR=$SSH_DIR" >> "$GITHUB_ENV"
          install -d -m 700 "$SSH_DIR"
          (umask 077 && printf '%s\n' "$SSH_KEY" > "$SSH_DIR/key")
          printf '%s\n' "$KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
      - name: Deploy the verified tag set
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          input="$(node scripts/release/deployment.mjs input)"
          ssh -i "$SSH_DIR/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            "deploy@$HOST" "$input"
      - name: Remove the SSH key
        if: ${{ always() }}
        run: rm -rf "$SSH_DIR"
      - name: Production smoke check
        env:
          SMOKE_BASE_URL: https://sebela.dev
        run: node scripts/release/production-smoke.mjs

  # After a healthy deployment: the next version from the Conventional Commits since the last
  # version tag, tagged on the release commit, and a GitHub release whose notes give the phase
  # highlights, group those commits and list the deployed images. Then the same notes become the
  # newest section of CHANGELOG.md through a pull request into master, which the owner merges; it
  # changes no image, so merging it releases nothing (docs/release-workflow.md, "Changelog").
  release:
    name: Version and GitHub release
    needs: [images, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: the tag, the release with its files and the changelog branch; pull-requests: the
    # changelog pull request; actions: starting CI on it, which a pull request opened with
    # GITHUB_TOKEN does not. The release files come from this run's artifact, which needs none.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      SHA: ${{ github.sha }}
      TAGS: ${{ needs.images.outputs.tags }}
      BUILT: ${{ needs.images.outputs.built }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The runner context is not available in a job's env, so the notes file is set here for the
      # steps that follow.
      - name: Version and changelog
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          echo "NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"
          NOTES_FILE="$NOTES_FILE" node scripts/release/deployment.mjs notes >> "$GITHUB_OUTPUT"
      # A rerun of an already released commit (its deployment rerun, say) publishes nothing:
      # `notes` prints release=false when a version tag already points at the commit. Neither does it
      # open a changelog pull request.
      #
      # The release attaches the SBOM and the attestation bundles of every image this run built
      # (docs/release-workflow.md, "Release files"); reused images have none, and the notes say so.
      # `prepare` checks every bundle against the pushed digest and fails before anything is
      # published. With files, the GitHub CLI creates the release as a draft, uploads them and only
      # then publishes it and its tag; a failed upload removes the draft and fails the step. The
      # published release's files are then checked, so a release without them fails the run.
      - name: Release files of the images built
        if: steps.notes.outputs.release == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files
      - name: Tag and publish the release
        if: steps.notes.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.notes.outputs.version }}
          DIGESTS: ${{ needs.images.outputs.digests }}
          FILES_DIR: ${{ runner.temp }}/release-files
          OUT_DIR: ${{ runner.temp }}/release-assets
        run: |
          set -o pipefail
          listed="$(node scripts/release/release-files.mjs prepare)"
          mapfile -t files <<< "$listed"
          gh release create "$VERSION" --target "$SHA" --title "$VERSION" --notes-file "$NOTES_FILE" \
            "${files[@]}"
          gh release view "$VERSION" --json assets --jq '.assets[].name' \
            | node scripts/release/release-files.mjs check
      # The section is the release notes themselves, on a branch from the current master. A pull
      # request opened with GITHUB_TOKEN starts no workflow, so CI is started on the branch by hand
      # (workflow_dispatch is the exception GitHub allows), compared with the master it was cut from;
      # its required check then reports on the pull request's head commit.
      - name: Changelog pull request
        if: steps.notes.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          branch="changelog/$VERSION"
          git fetch --quiet origin master
          base="$(git rev-parse origin/master)"
          git switch --quiet --create "$branch" "$base"
          node scripts/release/deployment.mjs changelog-entry
          git add CHANGELOG.md
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "chore(release): changelog for $VERSION"
          git push --quiet origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "chore(release): changelog for $VERSION" \
            --body "The section of $VERSION in CHANGELOG.md: the notes of its GitHub release, $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$VERSION. It changes no image, so merging it releases nothing (docs/release-workflow.md, Changelog)."
          gh workflow run ci.yml --ref "$branch" --field base="$base"
