# Dependabot keeps the dependencies current. Every pull request goes into master, where only the
# owner merges it (docs/git-workflow.md, Dependency pull requests), and its commit header passes the
# commit-message check: `ci: bump ...` for GitHub Actions, `chore(deps): bump ...` (or
# `chore(deps-dev): bump ...` when only development dependencies move) for everything else.
#
# - github-actions: every action is pinned to a full commit SHA with its version as a trailing
#   comment (scripts/checks/pinned-actions.mjs); Dependabot updates both. Once a month, all updates
#   in one pull request.
# - npm, /infra/pnpm: the hash-pinned pnpm of the container images (infra/README.md, pnpm in the
#   images). Its monthly pull request also has to move `packageManager` in package.json, which
#   scripts/checks/image-pnpm.test.mjs enforces, so the workspace entry below leaves pnpm alone.
# - npm, /: the pnpm workspace (package.json of every member, the catalog and overrides of
#   pnpm-workspace.yaml, pnpm-lock.yaml). Weekly: minor and patch updates in one pull request, each
#   major update in its own.
# - docker, /apps/*: the base image of every app's Dockerfile, pinned by tag and digest; an update
#   moves both. Weekly: every update of all Dockerfiles in one pull request, a new digest of the
#   same tag included (Node.js majors are ignored below).
# - uv, /: the uv workspace of the Python members (the exact versions in every member's
#   pyproject.toml and uv.lock). Weekly: minor and patch updates in one pull request, each major
#   update in its own. Dependabot runs its own, newer uv, which `required-version` in the root
#   pyproject.toml admits as a lower bound; CI checks the result with the repository's uv
#   (scripts/checks/uv-version.test.mjs). The build backend uv_build follows that uv version and
#   moves by hand with it, so it is ignored below. The client generator (openapi-python-client)
#   and the formatter and linter (Ruff) are kept out of the group: a 0.x minor of either can
#   change the generated client or the lint result, and would turn the whole group red.
#
# Node.js majors are not proposed: the Node.js version follows .nvmrc and `engines` in package.json
# and moves by hand, with @types/node and the images. A cooldown of seven days lets a new release
# settle before it is proposed (security updates ignore it).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /infra/pnpm
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: pnpm
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directories:
      - /apps/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - openapi-python-client
          - ruff
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: uv-build
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
