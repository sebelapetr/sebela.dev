# Local infrastructure: one Postgres with pgvector, shared by the main checkout and every worktree.
# Each worktree works in its own database in it (docs/repository-structure.md, "Ports and worktree
# isolation"). Every setting comes from the environment — the process environment or a `.env`
# file next to this one — and is documented in `.env.example`. A missing Postgres setting stops
# Compose. Compose interpolates every service, also those of an inactive profile, so the services
# of the profile `api` require nothing here: Postgres-only commands work with the Postgres settings
# alone. A missing API setting is empty in the containers, where the API's and the migration's own
# validation stops them with its name (`API_TRUSTED_PROXIES`, `STORAGE_WORKTREE` and the two
# `API_WEB_INVALIDATION_*` settings may be empty). The website's settings (profile `web`) work the
# same way: the website's own validation names a missing one on the first request.
# `pnpm stack:up` checks the four host-side settings, `API_HOST`, `API_PORT`, `WEB_HOST` and
# `WEB_PORT`, before it starts.
#
# `docker compose up` starts Postgres only. The profile `api` adds the containerised API stack of
# the main checkout (apps/api/AGENTS.md, "Container stack"): the one-off migration service and the
# API, both from the image of apps/api/Dockerfile. The profile `web` adds the website from the
# image of apps/web/Dockerfile (apps/web/AGENTS.md, "Container"); `pnpm stack:up` starts both.
# The profile `mcp-admin` adds MCP Admin from apps/mcp-admin/Dockerfile (apps/mcp-admin/AGENTS.md,
# "Container"); start it with `--profile api --profile mcp-admin`. The profile `ai-service` adds the
# AI service from apps/ai-service/Dockerfile, with the fictional model unless the paid one is chosen
# explicitly (apps/ai-service/AGENTS.md, "Container"); start it with
# `--profile api --profile ai-service` and the chat settings (all empty: the chat is off).
# Worktrees run the API and the website on the host instead; a disposable complete stack of its own
# (another project name, ports, password and storage folder) is what `pnpm test:web-stack` starts.
#
# The fixed project name makes every checkout address the same stack and volume.
name: sebela

# The database settings of the containers. Inside the Compose network the API reaches Postgres by
# its service name on the container port; these two values are part of this declaration, not
# settings, like the API's own container port below. The database, role and password are the
# checkout's own (DATABASE_*).
x-database-environment: &database-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  DATABASE_NAME: ${DATABASE_NAME:-}
  DATABASE_USER: ${DATABASE_USER:-}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

services:
  postgres:
    # pgvector is part of the image from the start, so retrieval (phase 9) needs no other image.
    # The tag names the versions (pgvector 0.8.7, PostgreSQL 18, Debian trixie); the digest of its
    # multi-architecture index pins the exact content, so a re-pushed tag cannot change what runs.
    # Upgrade both together: a PostgreSQL major version also needs a data upgrade.
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER (documented in .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (documented in .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB (documented in .env.example)}
    ports:
      - "${POSTGRES_HOST:?set POSTGRES_HOST (documented in .env.example)}:${POSTGRES_PORT:?set POSTGRES_PORT (documented in .env.example)}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [database]
    # Healthy once the server accepts queries over TCP — not only the temporary server of the first
    # initialisation — and the pgvector extension is available to create.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          psql --host 127.0.0.1 --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
          --no-psqlrc --tuples-only --no-align
          --command "SELECT count(*) FROM pg_available_extensions WHERE name = 'vector'"
          | grep --quiet --line-regexp 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s
    restart: unless-stopped

  # Applies the committed migrations once and exits. It starts when Postgres is healthy; the API
  # starts only when it has exited successfully, so a failed migration keeps the API down. The API
  # itself never migrates, and nothing here loads a seed.
  migrate:
    profiles: [api]
    build: *api-build
    command: [node, /app/packages/db/dist/cli/migrate.js]
    environment: *database-environment
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The API server. The seed and the first API key are explicit one-off commands in this service's
  # container (`pnpm stack:seed`, `pnpm stack:api-keys create <name>`), never part of a start.
  api:
    profiles: [api]
    build: *api-build
    environment:
      <<: *database-environment
      # The container listens on every interface on its own declared port; the host publishes it
      # on API_HOST and API_PORT only.
      API_HOST: 0.0.0.0
      API_PORT: "8080"
      API_BODY_LIMIT_BYTES: ${API_BODY_LIMIT_BYTES:-}
      API_TRUSTED_PROXIES: ${API_TRUSTED_PROXIES:-}
      API_RATE_LIMIT_HEALTH: ${API_RATE_LIMIT_HEALTH:-}
      API_RATE_LIMIT_PUBLIC: ${API_RATE_LIMIT_PUBLIC:-}
      API_RATE_LIMIT_PRIVATE: ${API_RATE_LIMIT_PRIVATE:-}
      API_RATE_LIMIT_KEY: ${API_RATE_LIMIT_KEY:-}
      API_RATE_LIMIT_MAX_TRACKED: ${API_RATE_LIMIT_MAX_TRACKED:-}
      API_RATE_LIMIT_UPLOAD: ${API_RATE_LIMIT_UPLOAD:-}
      # In the stack the API notifies the website's container by its service name, never the
      # host's API_WEB_INVALIDATION_URL: with a signing secret, the receiver below; without one,
      # no notifications. The website's WEB_INVALIDATION_SECRET must be the same value.
      API_WEB_INVALIDATION_URL: ${API_WEB_INVALIDATION_SECRET:+http://web:8080/internal/invalidation}
      API_WEB_INVALIDATION_SECRET: ${API_WEB_INVALIDATION_SECRET:-}
      # The visitor chat (apps/api/AGENTS.md, "Configuration"): all empty leaves it off. In the
      # stack the API calls the AI service's container by its service name, never the host's
      # API_AI_SERVICE_URL: with the generation token, the service below (profile `ai-service`);
      # without one, no AI service. The AI service is given the same two tokens, and the website
      # the same relay token.
      API_CHAT_ALLOWED_ORIGINS: ${API_CHAT_ALLOWED_ORIGINS:-}
      API_CHAT_COOKIE_SECURE: ${API_CHAT_COOKIE_SECURE:-}
      API_CHAT_FINGERPRINT_KEY: ${API_CHAT_FINGERPRINT_KEY:-}
      API_CHAT_RETENTION_DAYS: ${API_CHAT_RETENTION_DAYS:-}
      API_CHAT_MODEL: ${API_CHAT_MODEL:-}
      API_CHAT_EFFORT: ${API_CHAT_EFFORT:-}
      API_CHAT_PRICING_VERSION: ${API_CHAT_PRICING_VERSION:-}
      API_CHAT_RELAY_TOKEN: ${API_CHAT_RELAY_TOKEN:-}
      API_TURNSTILE_SECRET_KEY: ${API_TURNSTILE_SECRET_KEY:-}
      API_TURNSTILE_EXPECTED_HOSTNAME: ${API_TURNSTILE_EXPECTED_HOSTNAME:-}
      API_TURNSTILE_VERIFY_URL: ${API_TURNSTILE_VERIFY_URL:-}
      API_AI_SERVICE_URL: ${API_AI_SERVICE_TOKEN:+http://ai-service:8080}
      API_AI_SERVICE_TOKEN: ${API_AI_SERVICE_TOKEN:-}
      API_AI_CONTROL_TOKEN: ${API_AI_CONTROL_TOKEN:-}
      # Remote deletion of exported chat traces; all empty leaves the deletions pending.
      API_LANGFUSE_BASE_URL: ${API_LANGFUSE_BASE_URL:-}
      API_LANGFUSE_PUBLIC_KEY: ${API_LANGFUSE_PUBLIC_KEY:-}
      API_LANGFUSE_SECRET_KEY: ${API_LANGFUSE_SECRET_KEY:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-}
      # Local files live on the media volume below, not in the checkout, so they survive a restart
      # or a rebuilt container. The key namespaces (environment, worktree) apply below this folder.
      STORAGE_LOCAL_ROOT: /var/lib/sebela/media
      STORAGE_ENVIRONMENT: ${STORAGE_ENVIRONMENT:-}
      STORAGE_WORKTREE: ${STORAGE_WORKTREE:-}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
      STORAGE_BUNNY_ENDPOINT: ${STORAGE_BUNNY_ENDPOINT:-}
      STORAGE_BUNNY_REGION: ${STORAGE_BUNNY_REGION:-}
      STORAGE_BUNNY_ZONE: ${STORAGE_BUNNY_ZONE:-}
      STORAGE_BUNNY_PASSWORD: ${STORAGE_BUNNY_PASSWORD:-}
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-}
      MEDIA_MAX_IMAGE_DIMENSION: ${MEDIA_MAX_IMAGE_DIMENSION:-}
      # Retrieval: all empty switches it off. The provider key is a secret: do not put
      # VOYAGE_API_KEY in .env or any other file Compose reads; export it in the environment of
      # the process that starts the stack.
      RETRIEVAL_EMBEDDING_MODEL: ${RETRIEVAL_EMBEDDING_MODEL:-}
      RETRIEVAL_EMBEDDING_PRICE_PER_MILLION_TOKENS_USD: ${RETRIEVAL_EMBEDDING_PRICE_PER_MILLION_TOKENS_USD:-}
      RETRIEVAL_EMBEDDING_BATCH_SIZE: ${RETRIEVAL_EMBEDDING_BATCH_SIZE:-}
      RETRIEVAL_RERANK_MODEL: ${RETRIEVAL_RERANK_MODEL:-}
      RETRIEVAL_RERANK_PRICE_PER_MILLION_TOKENS_USD: ${RETRIEVAL_RERANK_PRICE_PER_MILLION_TOKENS_USD:-}
      RETRIEVAL_PROVIDER_TIMEOUT_MS: ${RETRIEVAL_PROVIDER_TIMEOUT_MS:-}
      RETRIEVAL_PROVIDER_RETRIES: ${RETRIEVAL_PROVIDER_RETRIES:-}
      RETRIEVAL_PROVIDER_MAX_RETRY_WAIT_MS: ${RETRIEVAL_PROVIDER_MAX_RETRY_WAIT_MS:-}
      RETRIEVAL_MONTHLY_CEILING_USD: ${RETRIEVAL_MONTHLY_CEILING_USD:-}
      RETRIEVAL_CANDIDATE_POOL: ${RETRIEVAL_CANDIDATE_POOL:-}
      RETRIEVAL_FINAL_PASSAGES: ${RETRIEVAL_FINAL_PASSAGES:-}
      RETRIEVAL_RELEVANCE_FLOOR: ${RETRIEVAL_RELEVANCE_FLOOR:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    # Empty host settings would publish on every interface on a random port, so start the stack
    # with `pnpm stack:up`, which refuses that.
    ports:
      - "${API_HOST:-}:${API_PORT:-}:8080"
    volumes:
      - api-media:/var/lib/sebela/media
    # The only service on every network: Postgres on one, its clients on the others.
    networks: [admin, chat, content, database]
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Healthy once the API answers its health route (which does not touch the database).
    healthcheck:
      test:
        - CMD
        - node
        - --eval
        - >-
          fetch("http://127.0.0.1:" + process.env.API_PORT + "/health")
          .then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  # The website: Next's self-contained server, built without any setting. Its server reads the API
  # and the stored files inside the Compose network by the API's service name; visitors see only
  # the public origins (WEB_SITE_ORIGIN, and images on the site's own `/media/` path). No API key.
  web:
    profiles: [web]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # The container listens on every interface on its own declared port; the host publishes it
      # on WEB_HOST and WEB_PORT only.
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8080"
      WEB_API_BASE_URL: http://api:8080
      WEB_SITE_ORIGIN: ${WEB_SITE_ORIGIN:-}
      # The public media folder the API names its files in (STORAGE_PUBLIC_BASE_URL, environment,
      # worktree), and where this server reads them: the API's file route inside the network for
      # local storage. With Bunny Storage set WEB_MEDIA_READ_BASE_URL to the media base itself.
      WEB_MEDIA_BASE_URL: ${WEB_MEDIA_BASE_URL:-}
      WEB_MEDIA_READ_BASE_URL: ${WEB_MEDIA_READ_BASE_URL:-http://api:8080/v1/media/files/${STORAGE_ENVIRONMENT:-}/${STORAGE_WORKTREE:-}}
      WEB_INVALIDATION_SECRET: ${WEB_INVALIDATION_SECRET:-}
      WEB_CONTENT_REVALIDATE_SECONDS: ${WEB_CONTENT_REVALIDATE_SECONDS:-}
      # Optional analytics (apps/web/AGENTS.md, "Configuration"): both empty means none.
      WEB_ANALYTICS_SCRIPT_URL: ${WEB_ANALYTICS_SCRIPT_URL:-}
      WEB_ANALYTICS_WEBSITE_ID: ${WEB_ANALYTICS_WEBSITE_ID:-}
      # Search engines may index the site only with `on`; empty means `noindex` everywhere.
      WEB_INDEXING: ${WEB_INDEXING:-}
      # The public Turnstile site key of the chat's person check; empty while the chat is off.
      WEB_TURNSTILE_SITE_KEY: ${WEB_TURNSTILE_SITE_KEY:-}
      # The chat relay's token (the API's API_CHAT_RELAY_TOKEN) and how many proxies in front of
      # the website append to X-Forwarded-For; the relay names the visitor's address from it.
      WEB_CHAT_RELAY_TOKEN: ${WEB_CHAT_RELAY_TOKEN:-}
      WEB_TRUSTED_PROXY_HOPS: ${WEB_TRUSTED_PROXY_HOPS:-}
    ports:
      - "${WEB_HOST:-}:${WEB_PORT:-}:8080"
    networks: [content]
    depends_on:
      api:
        condition: service_healthy
    # Healthy once the server answers a route that reads no content, so a website whose API is down
    # still counts as running: its pages then show their unavailable state (readiness of content is
    # the API's health).
    healthcheck:
      test:
        - CMD
        - node
        - --eval
        - >-
          fetch("http://127.0.0.1:" + process.env.WEB_PORT + "/robots.txt")
          .then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  # MCP Admin (apps/mcp-admin/AGENTS.md, "Container"): the private administrative MCP server. It
  # holds no API key and no database or storage setting; each caller sends its own key, which it
  # passes to the API by the API's service name. It shares the admin network with the API only, so
  # neither the website nor Postgres has a route to it, nor it to them. Published on the host's loopback interface; reach it from another
  # machine through an SSH tunnel, never a public address.
  mcp-admin:
    profiles: [mcp-admin]
    build:
      context: .
      dockerfile: apps/mcp-admin/Dockerfile
    environment:
      # The container listens on every interface on its own declared port; the host publishes it
      # on MCP_ADMIN_HOST and MCP_ADMIN_PORT only.
      MCP_ADMIN_HOST: 0.0.0.0
      MCP_ADMIN_PORT: "8080"
      MCP_ADMIN_API_URL: http://api:8080
      MCP_ADMIN_ALLOWED_HOSTS: ${MCP_ADMIN_ALLOWED_HOSTS:-}
      MCP_ADMIN_ALLOWED_ORIGINS: ${MCP_ADMIN_ALLOWED_ORIGINS:-}
      MCP_ADMIN_TRUSTED_PROXIES: ${MCP_ADMIN_TRUSTED_PROXIES:-}
      MCP_ADMIN_BODY_LIMIT_BYTES: ${MCP_ADMIN_BODY_LIMIT_BYTES:-}
      MCP_ADMIN_TIMEOUT_MS: ${MCP_ADMIN_TIMEOUT_MS:-}
      MCP_ADMIN_MAX_CONCURRENT: ${MCP_ADMIN_MAX_CONCURRENT:-}
      MCP_ADMIN_RATE_LIMIT_PREAUTH: ${MCP_ADMIN_RATE_LIMIT_PREAUTH:-}
      MCP_ADMIN_RATE_LIMIT_KEY: ${MCP_ADMIN_RATE_LIMIT_KEY:-}
      MCP_ADMIN_RATE_LIMIT_MAX_TRACKED: ${MCP_ADMIN_RATE_LIMIT_MAX_TRACKED:-}
    ports:
      - "${MCP_ADMIN_HOST:-}:${MCP_ADMIN_PORT:-}:8080"
    networks: [admin]
    depends_on:
      api:
        condition: service_healthy
    # Healthy once it answers its health route, which needs no key and calls no API.
    healthcheck:
      test:
        - CMD
        - node
        - --eval
        - >-
          fetch("http://127.0.0.1:" + process.env.MCP_ADMIN_PORT + "/health")
          .then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    # Stopped with SIGTERM: it ends in-flight MCP exchanges and closes its socket.
    restart: unless-stopped

  # The AI service (apps/ai-service/AGENTS.md, "Container"): the chat's generation behind the API.
  # It reads public content from the API and reports results to its internal control routes, by
  # the API's service name; it has no database, storage, media or API key setting and no volume,
  # so private originals never reach it. It shares the chat network with the API only and publishes
  # no port: only the API calls its generation route. Every setting empty runs the fictional model
  # (`fake`), so the stack never calls a paid provider unless AI_SERVICE_MODEL=anthropic,
  # AI_SERVICE_ALLOW_PAID=true, a ceiling and the provider key are all given explicitly. The
  # provider key is a secret: in development never put ANTHROPIC_API_KEY in a file Compose reads;
  # start the stack through the secret wrapper. Only the server's production environment file holds
  # it, mode 600 (infra/README.md). The fictional model's test files are not passed.
  ai-service:
    profiles: [ai-service]
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
    environment:
      # The container listens on every interface on its own declared port, inside the chat network.
      AI_SERVICE_HOST: 0.0.0.0
      LLM_AGENT_PORT: "8080"
      AI_SERVICE_API_URL: http://api:8080
      # The same tokens as the API's, so the pair always matches.
      AI_SERVICE_TOKEN: ${API_AI_SERVICE_TOKEN:-}
      AI_SERVICE_CONTROL_TOKEN: ${API_AI_CONTROL_TOKEN:-}
      # The label of the environment, the API's: with `production` the service refuses the fictional
      # model, so an empty provider setting can never look like a working chat.
      AI_SERVICE_ENVIRONMENT: ${STORAGE_ENVIRONMENT:-}
      AI_SERVICE_MODEL: ${AI_SERVICE_MODEL:-}
      AI_SERVICE_FAKE_SCENARIO: ${AI_SERVICE_FAKE_SCENARIO:-}
      AI_SERVICE_ALLOW_PAID: ${AI_SERVICE_ALLOW_PAID:-}
      AI_SERVICE_DAILY_CEILING_USD: ${AI_SERVICE_DAILY_CEILING_USD:-}
      AI_SERVICE_MAX_OPERATIONS: ${AI_SERVICE_MAX_OPERATIONS:-}
      AI_SERVICE_ADMISSION_WAIT_S: ${AI_SERVICE_ADMISSION_WAIT_S:-}
      AI_SERVICE_SHUTDOWN_GRACE_S: ${AI_SERVICE_SHUTDOWN_GRACE_S:-}
      # The metadata-only trace export; any key empty turns it off. AI_SERVICE_TRACE_DETECTOR_DIR is
      # not passed: no detector is accepted, and a detector folder would need a read-only mount.
      AI_SERVICE_LANGFUSE_BASE_URL: ${AI_SERVICE_LANGFUSE_BASE_URL:-}
      AI_SERVICE_LANGFUSE_PUBLIC_KEY: ${AI_SERVICE_LANGFUSE_PUBLIC_KEY:-}
      AI_SERVICE_LANGFUSE_SECRET_KEY: ${AI_SERVICE_LANGFUSE_SECRET_KEY:-}
      AI_SERVICE_LANGFUSE_ENVIRONMENT: ${AI_SERVICE_LANGFUSE_ENVIRONMENT:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    networks: [chat]
    depends_on:
      api:
        condition: service_healthy
    # Healthy once it answers its health route, which calls no model and no API.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, sys, urllib.request;
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:" + os.environ["LLM_AGENT_PORT"]
          + "/health", timeout=4).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    # Stopped with SIGTERM: it refuses new generations, waits up to AI_SERVICE_SHUTDOWN_GRACE_S (at
    # most 65 s) for running ones and Uvicorn adds 10 s, so Compose waits longer before SIGKILL.
    stop_grace_period: 75s
    restart: unless-stopped

# Postgres and its clients (the migration and the API) share `database`; the API and the website
# share `content`; the API and MCP Admin share `admin`; the API and the AI service share `chat`.
# Only the API is on all four, so nothing but the API and the migration can reach Postgres, and
# nothing but the API can reach MCP Admin or the AI service, inside Compose.
networks:
  database:
  content:
  admin:
  chat:

volumes:
  postgres-data:
  # Local uploaded media of the container stack. Removed only by `down --volumes`.
  api-media:
